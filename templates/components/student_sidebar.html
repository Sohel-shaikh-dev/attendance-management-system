<!-- Sidebar -->
<div id="sidebar" class="sidebar">
    <script>
        (function(){
            try {
                if (window.innerWidth > 768 && localStorage.getItem('student_sidebar_state') === '1') {
                    document.getElementById('sidebar').classList.add('expanded');
                }
            } catch(e) {}
        })();
    </script>
    <div class="logo">
        <i class="fas fa-user-graduate"></i>
        <span class="logo-text">Student</span>
        <button class="openbtn" onclick="toggleSidebar()">
            <i class="fas fa-bars"></i>
        </button>
    </div>
    <div class="sidebar-links-wrapper">
        <a href="{{ url_for('student_profile') }}" class="{% if request.path == url_for('student_profile') %}active{% endif %}" data-tooltip="Profile">
            <i class="fas fa-user-circle"></i><span>Profile</span>
        </a>
        <a href="{{ url_for('student_dashboard') }}" class="{% if request.path == url_for('student_dashboard') %}active{% endif %}" data-tooltip="Dashboard">
            <i class="fas fa-house"></i><span>Dashboard</span>
        </a>
        <a href="/student_notice" class="{% if request.path == '/student_notice' %}active{% endif %}" data-tooltip="Notice">
            <i class="fas fa-bullhorn"></i><span>Notice</span>
        </a>
        <a href="/student_focus" class="{% if request.path == '/student_focus' %}active{% endif %}" data-tooltip="Focus To Do">
            <i class="fas fa-check-circle"></i><span>Focus To Do</span>
        </a>
        <a href="/student_fees" class="{% if request.path == '/student_fees' %}active{% endif %}" data-tooltip="Fees">
            <i class="fas fa-credit-card"></i><span>Fees</span>
        </a>
        <a href="/student/support/tickets" class="{% if '/student/support' in request.path %}active{% endif %}" data-tooltip="Help & Support">
            <i class="fas fa-headset"></i><span>Help &amp; Support</span>
        </a>
        <a href="/student/rewards" class="{% if '/student/rewards' in request.path %}active{% endif %}" data-tooltip="Canteen Rewards">
            <i class="fas fa-gift"></i><span>Canteen Rewards</span>
        </a>
        <a href="/about" class="{% if request.path == '/about' %}active{% endif %}" data-tooltip="About Us">
            <i class="fas fa-university"></i><span>About Us</span>
        </a>
    </div>
    <div class="logout-btn">
        <a href="{{ url_for('logout') }}" data-tooltip="Logout">
            <i class="fas fa-sign-out-alt"></i><span>Logout</span>
        </a>
    </div>
</div>

<!-- Mobile Toggle Button -->
<button class="mobile-toggle" onclick="toggleSidebar()">
    <i class="fas fa-bars"></i>
</button>

<!-- Overlay for Mobile -->
<div id="sidebar-overlay" class="sidebar-overlay" onclick="toggleSidebar()"></div>

<!-- CSS for Sidebar -->
<style>
    :root {
        --sidebar-width-collapsed: 80px;
        --sidebar-width-expanded: 240px;
        --sidebar-bg: rgba(44, 62, 80, 0.95);
        --sidebar-bg-solid: #2c3e50;
        --sidebar-hover: #34495e;
        --sidebar-active: #1abc9c;
        --sidebar-text: #ecf0f1;
        --transition-smooth: 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
    }

    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        font-family: 'Poppins', 'Inter', sans-serif;
        background-color: #f4f6fa;
        overflow-x: hidden;
    }

    .sidebar {
        height: 100vh;
        width: var(--sidebar-width-collapsed);
        position: fixed;
        top: 0;
        left: 0;
        background: linear-gradient(to bottom, rgba(44,62,80,0.98), rgba(52,73,94,0.98));
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border-right: 1px solid rgba(255,255,255,0.05);
        box-shadow: 4px 0 20px rgba(0, 0, 0, 0.15);
        overflow-x: hidden;
        overflow-y: auto;
        transition: width var(--transition-smooth), transform var(--transition-smooth);
        display: flex;
        flex-direction: column;
        align-items: center;
        z-index: 9999;
        will-change: width, transform;
    }

    .sidebar::-webkit-scrollbar {
        width: 0px;
        background: transparent;
    }

    .sidebar.expanded {
        width: var(--sidebar-width-expanded);
        align-items: flex-start;
    }

    .logo {
        width: 100%;
        padding: 24px 10px;
        color: white;
        font-size: 22px;
        font-weight: 700;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 15px;
        border-bottom: 1px solid rgba(255,255,255,0.05);
        margin-bottom: 10px;
    }

    .sidebar.expanded .logo {
        flex-direction: row;
        justify-content: space-between;
        padding: 24px 20px;
    }

    .logo i {
        color: var(--sidebar-active);
        font-size: 24px;
        filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
    }

    .logo-text {
        display: none;
        letter-spacing: 0.5px;
    }

    .sidebar.expanded .logo-text {
        display: inline;
        animation: fadeIn 0.3s ease forwards;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateX(-10px); }
        to { opacity: 1; transform: translateX(0); }
    }

    .sidebar-links-wrapper {
        width: 100%;
        flex-grow: 1;
        display: flex;
        flex-direction: column;
        padding-top: 10px;
    }

    .sidebar a {
        width: calc(100% - 20px);
        padding: 14px 18px;
        color: var(--sidebar-text);
        border-radius: 12px;
        margin: 4px 10px;
        text-decoration: none;
        font-size: 15px;
        font-weight: 500;
        display: flex;
        align-items: center;
        gap: 16px;
        position: relative;
        transition: all 0.3s ease;
        border: 1px solid transparent;
    }

    .sidebar a i {
        font-size: 18px;
        min-width: 24px;
        text-align: center;
        transition: transform 0.3s ease;
    }

    .sidebar a span {
        display: none;
        white-space: nowrap;
    }

    .sidebar.expanded a span {
        display: inline;
    }

    .sidebar a:hover {
        background-color: var(--sidebar-hover);
        /* transform: translateX(4px); removed to prevent clipping */
        box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        border-color: rgba(255,255,255,0.05);
    }

    .sidebar a.active {
        background-color: var(--sidebar-active);
        color: #fff;
        box-shadow: 0 4px 15px rgba(26, 188, 156, 0.3);
    }
    
    .sidebar a.active i {
        transform: scale(1.1);
    }

    .sidebar a[data-tooltip]:hover::after {
        content: attr(data-tooltip);
        position: absolute;
        left: calc(100% + 10px);
        background-color: #1e293b;
        color: #fff;
        padding: 6px 12px;
        border-radius: 6px;
        white-space: nowrap;
        font-size: 13px;
        font-weight: 500;
        box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        opacity: 0;
        animation: tooltipFade 0.2s 0.1s forwards;
        z-index: 999;
        pointer-events: none;
    }

    @keyframes tooltipFade {
        to { opacity: 1; transform: translateX(5px); }
    }

    .sidebar.expanded a[data-tooltip]:hover::after {
        display: none;
    }

    .logout-btn {
        margin-top: auto;
        width: 100%;
        padding-bottom: 20px;
        padding-top: 10px;
        border-top: 1px solid rgba(255,255,255,0.05);
    }

    .logout-btn a {
        background-color: rgba(192, 57, 43, 0.8);
        border: 1px solid rgba(231, 76, 60, 0.3);
    }

    .logout-btn a:hover {
        background-color: #e74c3c;
        transform: translateY(-2px);
        box-shadow: 0 6px 15px rgba(231, 76, 60, 0.4);
    }

    .openbtn {
        font-size: 16px;
        background-color: rgba(255,255,255,0.1);
        color: white;
        border: none;
        cursor: pointer;
        padding: 6px 10px;
        border-radius: 8px;
        margin-left: 0;
        transition: background 0.3s;
    }

    .sidebar.expanded .openbtn {
        margin-left: auto;
    }

    .openbtn:hover {
        background-color: rgba(255,255,255,0.2);
    }

    .mobile-toggle {
        display: none;
        position: fixed;
        top: 15px;
        left: 15px;
        z-index: 9999;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        color: #2c3e50;
        border: 1px solid rgba(0,0,0,0.05);
        cursor: pointer;
        font-size: 22px;
        padding: 10px 14px;
        border-radius: 12px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
        transition: transform 0.3s, background 0.3s;
    }

    .mobile-toggle:hover, .mobile-toggle:active {
        background-color: #fff;
        transform: scale(1.05);
    }

    .sidebar-overlay {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(15, 23, 42, 0.6);
        backdrop-filter: blur(4px);
        z-index: 999;
        opacity: 0;
        transition: opacity var(--transition-smooth);
    }

    /* Standardized Main Content Margins */
    .main {
        margin-left: var(--sidebar-width-collapsed);
        padding: 2rem 3rem;
        transition: margin-left var(--transition-smooth);
        min-height: 100vh;
    }

    .sidebar.expanded ~ .main {
        margin-left: var(--sidebar-width-expanded);
    }

    /* Responsive Design */
    @media screen and (max-width: 992px) {
        .main {
            padding: 2rem;
        }
    }

    @media screen and (max-width: 768px) {
        .sidebar {
            transform: translateX(-100%);
            width: var(--sidebar-width-expanded) !important;
        }

        .sidebar.expanded {
            transform: translateX(0);
        }

        .openbtn {
            display: none !important;
        }

        .mobile-toggle {
            display: block !important;
        }
        
        .sidebar.expanded ~ .mobile-toggle {
            display: none !important;
        }

        .sidebar.expanded ~ .sidebar-overlay {
            display: block;
            opacity: 1;
        }

        .main, .sidebar.expanded ~ .main {
            margin-left: 0 !important;
            padding: 5rem 1.5rem 1.5rem !important; 
        }
    }
</style>

<!-- JavaScript for Sidebar -->
<script>
    function toggleSidebar() {
        const sidebar = document.getElementById("sidebar");
        const isExpanded = sidebar.classList.toggle("expanded");
        
        try {
            localStorage.setItem('student_sidebar_state', isExpanded ? '1' : '0');
        } catch(e) {}
    }

    // Initialize state on load safely
    document.addEventListener('DOMContentLoaded', () => {
        const sidebar = document.getElementById("sidebar");
        // On desktop, default to expanded if saved, else collapsed
        if (window.innerWidth > 768) {
            try {
                if(localStorage.getItem('student_sidebar_state') === '1') {
                    sidebar.classList.add("expanded");
                } else {
                    sidebar.classList.remove("expanded");
                }
            } catch(e) {}
        } else {
            // Always collapse on mobile load
            sidebar.classList.remove("expanded");
        }
    });

    // Handle resize safely
    window.addEventListener('resize', () => {
        const sidebar = document.getElementById("sidebar");
        if (window.innerWidth > 768) {
            try {
                if(localStorage.getItem('student_sidebar_state') === '1') {
                    sidebar.classList.add("expanded");
                }
            } catch(e) {}
        } else {
            sidebar.classList.remove("expanded");
        }
    });
</script>
